name: Validate Rant

on:
  push:
    branches:
      - feat/streaming-workbench
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/rant-vite.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          node tests/browser-smoke.mjs
